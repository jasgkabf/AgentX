version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentx
      POSTGRES_USER: agentx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentx123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentx"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  brain:
    build:
      context: ../brain
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - MAX_ITERATIONS=30
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../scheduler
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://agentx:${POSTGRES_PASSWORD:-agentx123}@postgres:5432/agentx
      - REDIS_URL=redis://redis:6379
      - BRAIN_URL=http://brain:8000
      - DOCKER_HOST=unix:///var/run/docker.sock
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-agentx-encryption-key-2024}
      - SANDBOX_IMAGE=agentx-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - workspace:/workspace
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      brain:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_WS_URL=ws://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - scheduler

volumes:
  pgdata:
  redisdata:
  workspace:
